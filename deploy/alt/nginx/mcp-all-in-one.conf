# 复制到 /etc/nginx/sites-available/mcp-all-in-one.conf
# 然后：sudo ln -s /etc/nginx/sites-available/mcp-all-in-one.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
#
# 首次申请证书：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d nps.yunmiao.site

upstream mcp_all_in_one {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nps.yunmiao.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nps.yunmiao.site;

    ssl_certificate     /etc/letsencrypt/live/nps.yunmiao.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nps.yunmiao.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /mcp {
        proxy_pass http://mcp_all_in_one;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 10m;
    }

    location /health {
        proxy_pass http://mcp_all_in_one;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }
}
