# 宝塔面板的 nps.yunmiao.site 站点 vhost 配置片段
#
# 用法（推荐）：
#   宝塔 -> 网站 -> nps.yunmiao.site -> 设置 -> 配置文件
#   把 server { ... } 整个 server 块替换为下面这块（保留宝塔自动生成的
#   ssl_certificate / ssl_certificate_key / include snippets 等行）。
#
# 注意：
#   - 宝塔会自行维护 listen 80/443、ssl_certificate、include，所以下面
#     只写 location 块，贴到宝塔现有 server { ... } 里对应位置。
#   - 如果你直接用本文件覆盖宝塔文件，记得保留宝塔的 include 行
#     (include enable-php-*.conf; include /www/server/panel/vhost/nginx/rewrite/*.conf; 等)

# === 替换 / 追加以下 location 块到 server { ... } 中 ===

# 健康检查（无需 token）
location /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# MCP Streamable HTTP 端点
location /mcp {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamable HTTP / SSE 必须
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    client_max_body_size 10m;
}

# 兜底：其它路径返回 404（不要破坏宝塔面板的 /.well-known/acme-challenge 等）
# 一般不需要在宝塔里加这个 location，保持默认即可。
