name: CD

# 仅 push 到 main 时部署（PR 不触发），与 miao-infra 一致。
# 部署审批由 prod 环境的 Required reviewers 保护规则提供（仓库需为 public 或 Team/Enterprise plan）：
# push 后 CD 作业进入等待，指定审批人（moonlight2893267956）在
# Actions run 页面点 Review deployments -> Approve 后才真正执行。
on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 引用 prod 环境（读取 SSH_KEY secret 与各 vars.，提供部署变量隔离）：
    #   - SSH_KEY 放 Environment secrets（敏感，日志打码）
    #   - 其余（SSH_HOST/USER/PORT/DEPLOY_PATH）放 Environment variables，用 vars. 读取
    # 该环境已配置 Required reviewers（moonlight2893267956），
    # push 后需其审批通过才会真正执行部署（与 miao-infra 一致）。
    environment: prod
    steps:
      - name: SSH 登录并部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.SSH_DEPLOY_PATH || '/opt/mcp-all-in-one' }}"

            # node / npm PATH：兼容 nvm 与宝塔（宝塔 Node 路径非标准）
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              source "$HOME/.nvm/nvm.sh"
            elif [ -d /www/server/nodejs ]; then
              export PATH="$(ls -d /www/server/nodejs/*/bin | head -1):$PATH"
            fi
            node -v; npm -v

            # 宝塔 npm cache 权限（有密码 sudo 才执行，失败不阻断构建）
            if command -v sudo >/dev/null && sudo -n true 2>/dev/null; then
              sudo chown -R 1004:1005 /www/server/nodejs/cache 2>/dev/null || true
            fi

            echo ">>> git pull"
            git pull --ff-only

            echo ">>> install + build"
            # 注意：build 用的是 tsc（devDependency），必须完整安装，不能 --omit=dev
            npm ci --include=dev
            npm run build
            # 产物必须存在，否则后面 restart 会静默失败（PM2 起不来且看不出原因）
            test -f build/index.js || { echo "!! build/index.js missing after build" >&2; exit 1; }
            npm prune --omit=dev   # 构建完后剔除 dev 依赖，保持运行时精简

            echo ">>> restart (pm2)"
            # PM2 守护进程可能因机器重启而丢失进程列表，此时 describe 返回非 0。
            # 先确保守护进程在线，再按需 restart 或 start；任一步失败都不让 set -e 误杀。
            pm2 ping >/dev/null 2>&1 || pm2 resurrect >/dev/null 2>&1 || true
            if pm2 describe mcp-all-in-one >/dev/null 2>&1; then
              echo "    restarting existing app"
              pm2 restart mcp-all-in-one
            else
              echo "    starting new app (PM2 process list was empty)"
              pm2 start ecosystem.config.cjs
            fi
            pm2 save

            echo ">>> health (等待进程监听，最多 20s)"
            health_ok=0
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${PORT:-3030}/health"; then
                echo " <- health OK"
                health_ok=1
                break
              fi
              sleep 1
            done
            if [ "$health_ok" -ne 1 ]; then
              echo "!! health check failed after 20s" >&2
              pm2 logs mcp-all-in-one --lines 30 --nostream 2>&1 | tail -30 >&2 || true
              exit 1
            fi
